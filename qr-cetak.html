<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR Misi Harta Karun Aztec</title>
<style>body{font:16px system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#2b1d10}input{width:100%;box-sizing:border-box;padding:12px;font:inherit;margin:8px 0 12px}button{padding:10px 16px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}.card{border:1px solid #c9b58b;border-radius:12px;padding:16px;text-align:center;break-inside:avoid}.card img{width:190px;height:190px;max-width:100%}.small{color:#65533e;font-size:14px}@media print{.controls{display:none}.card{border:1px solid #777}.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><h1>QR Code — Misi Harta Karun Aztec</h1><p class="small">Masukkan alamat publik permainan (contoh: https://akun.github.io/misi-harta-karun-aztec/). QR baru benar setelah alamat website online dan dapat dibuka.</p>
<div class="controls"><label for="base">Alamat website publik</label><input id="base" placeholder="https://akun.github.io/misi-harta-karun-aztec/"><button onclick="makeQR()">Buat QR</button> <button onclick="window.print()">Cetak QR</button><p id="msg" class="small"></p></div><div id="grid" class="grid"></div>
<script>
function makeQR(){let raw=document.getElementById('base').value.trim();let msg=document.getElementById('msg');let grid=document.getElementById('grid');grid.innerHTML='';try{let u=new URL(raw);if(!/^https?:$/.test(u.protocol))throw Error();let items=[['QR UTAMA','Buka permainan',u.href],['POS 1 — Lembah Passing','Pindai saat berada di pos 1',withPos(u,1)],['POS 2 — Hutan Dribel','Pindai saat berada di pos 2',withPos(u,2)],['POS 3 — Kuil Shooting','Pindai saat berada di pos 3',withPos(u,3)],['POS 4 — Gerbang Kuil','Pindai saat berada di pos 4',withPos(u,4)]];items.forEach(([title,desc,url])=>{let d=document.createElement('div');d.className='card';let h=document.createElement('h2');h.textContent=title;let img=document.createElement('img');img.alt='QR '+title;img.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data='+encodeURIComponent(url);let p=document.createElement('p');p.textContent=desc;let code=document.createElement('code');code.style='font-size:11px;overflow-wrap:anywhere';code.textContent=url;d.append(h,img,p,code);grid.append(d)});msg.textContent='QR dibuat. Uji semua kode dengan HP sebelum dicetak.'}catch(e){msg.textContent='Masukkan URL lengkap yang valid, termasuk https://'}}
function withPos(u,n){let x=new URL(u.href);x.searchParams.set('pos',String(n));return x.href}
</script></body></html>
